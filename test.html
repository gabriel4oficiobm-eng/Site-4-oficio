<!DOCTYPE html>
<html>
<head>
    <title>Teste Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Teste de Login</h1>
    <input type="email" id="email" placeholder="Email" value="teste@teste.com">
    <input type="password" id="pass" placeholder="Senha" value="123456">
    <button onclick="logar()">Entrar</button>
    <p id="msg"></p>

    <script>
        const supabase = supabase.createClient(
            'https://cqvkfrojkicfxipwltz.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxdmtmcm9qa2ppY2Z4aXB3bHR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzOTQzNzksImV4cCI6MjA4Nzk3MDM3OX0.THdrIPT1L9l3WPD3ltuI4oR0ggAn-MUi_FCqPfBobDE'
        );

        async function logar() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: pass
            });
            
            if (error) {
                document.getElementById('msg').innerHTML = '❌ Erro: ' + error.message;
                console.log(error);
            } else {
                document.getElementById('msg').innerHTML = '✅ Login OK! Redirecionando...';
                setTimeout(() => location.href = 'admin.html', 1000);
            }
        }
    </script>
</body>
</html>
