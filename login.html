<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 4º Ofício</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Auth - Caminho corrigido para public/js/auth.js -->
    <script src="public/js/auth.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;<br/>
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);<br/>
            min-height: 100vh;<br/>
            display: flex;<br/>
            align-items: center;<br/>
            justify-content: center;
        }
        
        .login-box {
            background: white;<br/>
            padding: 40px;<br/>
            border-radius: 12px;<br/>
            width: 90%;<br/>
            max-width: 400px;<br/>
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;<br/>
            color: #1e3c72;<br/>
            margin-bottom: 30px;<br/>
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;<br/>
            margin-bottom: 8px;<br/>
            color: #333;<br/>
            font-weight: 500;
        }
        
        input {
            width: 100%;<br/>
            padding: 12px;<br/>
            border: 2px solid #e0e0e0;<br/>
            border-radius: 8px;<br/>
            font-size: 16px;<br/>
            transition: border-color 0.3s;
        }
        
        input:focus {<br/>
            outline: none;<br/>
            border-color: #1e3c72;
        }
        
        button {
            width: 100%;<br/>
            padding: 14px;<br/>
            background: #1e3c72;<br/>
            color: white;<br/>
            border: none;<br/>
            border-radius: 8px;<br/>
            font-size: 16px;<br/>
            font-weight: 600;<br/>
            cursor: pointer;<br/>
            transition: background 0.3s;
        }
        
        button:hover {<br/>
            background: #2a5298;
        }
        
        .error {
            color: #e74c3c;<br/>
            text-align: center;<br/>
            margin-top: 15px;<br/>
            padding: 10px;<br/>
            background: #fee;<br/>
            border-radius: 6px;<br/>
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Área Administrativa</h1>
        <p style="text-align: center; color: #666; margin-bottom: 25px;">
            4º Ofício de Registro de Imóveis
        </p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    value="admin@cartorio4oficio.com"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Digite sua senha"
                    required
                >
            </div>
            
            <button type="submit">Entrar no Sistema</button>
        </form>
        
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        // Função para verificar o login e redirecionar
        async function checkLoginAndRedirect() {
            // Espera o Auth estar pronto
            if (!window.Auth || !window.Auth.client) {
                console.log('Auth não pronto, aguardando...');
                setTimeout(checkLoginAndRedirect, 100); // Tenta novamente em 100ms
                return;
            }

            const { user, profile, error } = await window.Auth.getCurrentUser();
            if (user && window.Auth.isAdmin(profile)) {
                window.location.href = 'admin.html'; // Redireciona para o dashboard
            }
        }

        // Executa a verificação ao carregar a página
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginAndRedirect(); // Verifica se já está logado

            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMsg');
                
                errorMsg.style.display = 'none'; // Esconde mensagens de erro anteriores

                if (!window.Auth) {
                    errorMsg.textContent = 'Erro: Sistema de autenticação não carregou. Recarregue a página.';
                    errorMsg.style.display = 'block';
                    console.error('window.Auth não encontrado no submit.');
                    return;
                }
                
                const result = await window.Auth.login(email, password);
                
                if (result.success) {
                    window.location.href = 'admin.html'; // Redireciona para o dashboard
                } else {
                    errorMsg.textContent = result.error || 'Erro desconhecido no login.';
                    errorMsg.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
