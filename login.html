<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 4º Ofício</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="public/js/auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #1e3c72;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background: #2a5298;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(30, 60, 114, 0.3);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .error {
            color: #e74c3c;
            background: #fee;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
        
        .loading {
            display: none;
            margin-top: 15px;
            color: #1e3c72;
            font-size: 14px;
        }
        
        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="icon">🔐</div>
            <h1>Área Administrativa</h1>
            <p>4º Ofício de Registro de Imóveis</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    value="admin@cartorio4oficio.com"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Digite sua senha"
                    required
                >
            </div>
            
            <button type="submit" id="btnLogin">
                Entrar no Sistema
            </button>
        </form>
        
        <div class="loading" id="loading">Carregando...</div>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const btnLogin = document.getElementById('btnLogin');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('errorMsg');
            
            // Verifica se Auth carregou
            if (!window.Auth || window.Auth.error) {
                console.error('Auth não disponível:', window.Auth?.error);
                errorMsg.textContent = 'Erro ao carregar sistema. Recarregue a página.';
                errorMsg.style.display = 'block';
                btnLogin.disabled = true;
                return;
            }
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // UI de loading
                btnLogin.disabled = true;
                btnLogin.textContent = 'Entrando...';
                loading.style.display = 'block';
                errorMsg.style.display = 'none';
                
                // Tenta login
                const result = await window.Auth.login(email, password);
                
                // Reset UI
                btnLogin.disabled = false;
                btnLogin.textContent = 'Entrar no Sistema';
                loading.style.display = 'none';
                
                if (result.success) {
                    console.log('✅ Login OK, redirecionando...');
                    window.location.href = 'admin.html';
                } else {
                    console.error('❌ Erro login:', result.error);
                    errorMsg.textContent = result.error || 'Erro no login. Verifique suas credenciais.';
                    errorMsg.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
